<style>
  * { box-sizing: border-box; }
  body { font-family: "Google Sans", Roboto, Arial, sans-serif; font-size: 14px; color: #202124; margin: 0; padding: 4px 4px 0; }
  label { display: block; font-size: 12px; color: #5f6368; margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  input[type="datetime-local"], select { width: 100%; font: inherit; padding: 8px; border: 1px solid #dadce0; border-radius: 4px; background: #fff; color: #202124; }
  input:focus, select:focus { outline: 2px solid #1a73e8; outline-offset: -1px; border-color: transparent; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: #202124; }
  .check input { margin: 0; }
  .muted { font-size: 12px; color: #5f6368; margin-top: 6px; min-height: 16px; }
  .target { font-size: 12px; color: #5f6368; margin-bottom: 10px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  button { font: inherit; padding: 8px 18px; border-radius: 4px; cursor: pointer; border: 1px solid #dadce0; background: #fff; color: #1a73e8; }
  button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .error { color: #d93025; }
</style>
